name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: dist/MST2HocvPatcher_1.2.exe
          - os: ubuntu-22.04
            artifact: dist/MST2HocvPatcher_1.2
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: pip install PySide6 pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python -m PyInstaller --onefile --windowed --icon=icon.ico --name "MST2HocvPatcher_1.2" --add-data "icon.ico;." MST2HocvPatcher.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload to release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MST2HocvPatcher_1.2-${{ runner.os }}
          path: ${{ matrix.artifact }}
